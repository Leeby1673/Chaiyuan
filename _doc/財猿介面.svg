  <path d="M550 420 L550 460 L340 460" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)" style="fill:none;stroke:rgb(136, 135, 128);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

